[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 64, fail_on_revert = true }

remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "v4-periphery/=lib/v4-periphery/",
  "@uniswap/uerc20-factory/=lib/uerc20-factory/",
  "@uniswap/liquidity-launcher/=lib/liquidity-launcher/",
  "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "permit2/=lib/permit2/",
  "forge-std/=lib/forge-std/src/",
  "solmate/=lib/v4-core/lib/solmate/",
]

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 256, depth = 128, fail_on_revert = true }

# Mainnet fork rehearsal — RPC injected at runtime, never committed.
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
